[workspace]
channels = ["conda-forge"]
name = "deeplearning-image-analysis-workshop"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]


[system-requirements]
cuda = "12.0"

[feature.cpu.dependencies]
pytorch = ">=2.10.0,<3"

[feature.gpu.dependencies]
pytorch-gpu = ">=2.10.0,<3"


[feature.py312.dependencies]
python = "3.12.*"
scikit-image = ">=0.26.0,<0.27"
scikit-learn = ">=1.8.0,<2"
torchvision = ">=0.26.0,<0.27"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.2,<4"
jupyterlab = ">=4.5.6,<5"
s3fs = ">=2026.3.0,<2027"
tifffile = ">=2026.4.11,<2027"
imagecodecs = ">=2026.3.6,<2027"
umap-learn = ">=0.5.12,<0.6"
torchmetrics = ">=1.9.0,<2"

[environments]
py312 = ["py312", "cpu"]
py312-gpu = ["py312", "gpu"]
